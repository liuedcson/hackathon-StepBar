<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>StepBar 配对</title>
<style>body{font:15px system-ui;max-width:600px;margin:50px auto;padding:24px}input,select,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0}code{overflow-wrap:anywhere}</style>
<h1>连接本机 StepBar</h1><p>从 StepBar 设置中点击「安装 Chrome 扩展」，加载下载目录的 StepBar-browser-extension 文件夹后会自动配对。直接加载仓库源码时，在 StepBar「设置」里复制配对码粘贴到这里。扩展只与本机 127.0.0.1 通信：上报打开的标签页、停留页面的正文摘录，并执行切换/关闭标签页。</p>
<label>配对码<input id="token" type="password" autocomplete="off"></label>
<button id="save">保存并连接</button><p id="status"></p><script src="options.js"></script></html>
